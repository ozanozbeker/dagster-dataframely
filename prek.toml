default_language_version.python = "3.12"
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"  # frozen: v4.4.0

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "--strict",
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1

[[repos.hooks]]
id = "gitleaks"

# Basic file checks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12

[[repos.hooks]]
id = "actionlint"

# zizmor checks workflows for security problems, which actionlint does not check.
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1

[[repos.hooks]]
id = "zizmor"

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "512fc24f32f44ab01972217aaaf3dc86ec234d53"  # frozen: v1.50.2

[[repos.hooks]]
id = "typos"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix --force-exclude"
language = "system"
types_or = ["python", "pyi", "jupyter"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
# `files`, not `types_or` as in `ruff-check`, because prek does not tag a `.qmd` as markdown
# or python, and ruff would not format the guide's code chunks.
files = '\.(py|pyi|ipynb|md|qmd)$'
require_serial = true

[[repos.hooks]]
id = "rumdl"
name = "rumdl"
entry = "uv run rumdl check --fix"
language = "system"
# `files`, not `types = ["markdown"]`, because prek does not tag a `.qmd` as markdown, and
# rumdl would not lint the guide's pages.
files = '\.(md|qmd)$'
require_serial = true

# The README contains copies of demo modules, because GitHub and PyPI cannot include a file.
# The hook also runs when only a demo module changed, because that makes a copy out of date.
[[repos.hooks]]
id = "sync-demo-snippets"
name = "sync demo snippets"
entry = "uv run python scripts/sync-demo-snippets.py"
language = "system"
files = '^(README\.md|user_guide/.*\.qmd|demo/src/.*\.py)$'
pass_filenames = false

[[repos.hooks]]
id = "uv-lock"
name = "uv lock --check"
entry = "uv lock --check"
language = "system"
files = '^(.*/)?(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uv run pyrefly check"
language = "system"
types = ["python"]
pass_filenames = false

# Two pygrep hooks ban a pattern in the package source, because each is a text search, not a test.

# Prevents a statistic you cannot cast back to a dtype: `describe()` formats each value by the
# column's dtype, so a `Date` mean prints as a datetime and `min` mixes numbers, strings and dates.
# `_statistics.py` computes with typed Polars expressions and converts to strings once, for display.
[[repos.hooks]]
id = "no-describe"
name = "no describe() in the package"
entry = "\\.describe\\("
language = "pygrep"
files = '^src/dagster_dataframely/.*\.py$'

# Prevents a fourth source for a setting. Dagster loads code locations lazily, so a default set
# in code would depend on import order, and the same asset could get different checks.
[[repos.hooks]]
id = "no-default-setter"
name = "no set_default_*() in the package"
entry = "def set_default"
language = "pygrep"
files = '^src/dagster_dataframely/.*\.py$'

# Prevents figures of speech in prose. `CONTEXT.md` lists these words and what to write instead.
# `exclude` skips the files that list the words (`CONTEXT.md`, `CLAUDE.md`, this one), the
# changelog and the skill files.
[[repos.hooks]]
id = "no-figures-of-speech"
name = "no figures of speech in prose"
entry = '\b(refus(e|es|ed|ing|al|als)|culprits?|verdicts?|consent\w*|evidence|surviv\w*|orphan\w*|tripwires?|dials?|knobs?|seams?|gat(e|es|ed|ing)|rid(e|es|ing)|halves|voices|spellings?|held-back|house[ -]style|schema-backed|quarantined assets?|hand-wirers?|runtime-real|manager-blind|asset-key-addressed|(rule|value|data)-bearing)\b|\bhand(s|ed|ing)? back\b|\b(held|hold(s|ing)?)( \w+)? back\b'
language = "pygrep"
args = ["--ignore-case"]
files = '\.(py|md|qmd|toml|ya?ml|sh)$'
exclude = '^(CONTEXT\.md|CLAUDE\.md|CHANGELOG\.md|prek\.toml|\.claude/|docs/agents/)'
