default_language_version.python = "3.12"
default_stages = ["pre-commit"]

exclude = "archive/"

# Conventional Commits enforcement
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "--strict",
]

# Gitleaks - secret detection
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

# Standard hygiene hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix --force-exclude"
language = "system"
types_or = ["python", "pyi", "jupyter"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
# Markdown is included so ruff formats the Python inside fenced code blocks.
# `ruff check` has no Markdown support, so it stays off that hook's list.
types_or = ["python", "pyi", "jupyter", "markdown"]
require_serial = true

[[repos.hooks]]
id = "rumdl"
name = "rumdl"
entry = "uv run rumdl check --fix"
language = "system"
types = ["markdown"]
require_serial = true

[[repos.hooks]]
id = "uv-lock"
name = "uv lock --check"
entry = "uv lock --check"
language = "system"
files = '^(.*/)?(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "ty"
name = "ty"
entry = "uv run ty check"
language = "system"
types = ["python"]
pass_filenames = false
