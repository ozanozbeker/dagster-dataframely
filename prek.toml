default_language_version.python = "3.12"
default_stages = ["pre-commit"]

# Conventional Commits enforcement
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"  # frozen: v4.4.0

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "--strict",
]

# Gitleaks - secret detection
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1

[[repos.hooks]]
id = "gitleaks"

# Standard hygiene hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12

[[repos.hooks]]
id = "actionlint"

# zizmor - GitHub Actions security auditing
# actionlint checks whether a workflow is correct; this checks whether it is safe.
# The threat model is Actions-specific, so neither ruff nor a general scanner sees it:
# `${{ }}` pasted into a shell, privileged triggers running fork code, mutable action
# refs, over-scoped tokens.
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "451b56af716f9f0d0c2b816503a3fd0cf8b036fa"  # frozen: v1.29.0

[[repos.hooks]]
id = "zizmor"

# typos - source and prose spell checking
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "8a48f81b6c64dcfea44b3633223084c4be58ac5f"  # frozen: v1.49.0

[[repos.hooks]]
id = "typos"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix --force-exclude"
language = "system"
types_or = ["python", "pyi", "jupyter"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
types_or = ["python", "pyi", "jupyter", "markdown"]
require_serial = true

[[repos.hooks]]
id = "rumdl"
name = "rumdl"
entry = "uv run rumdl check --fix"
language = "system"
types = ["markdown"]
require_serial = true

[[repos.hooks]]
id = "uv-lock"
name = "uv lock --check"
entry = "uv lock --check"
language = "system"
files = '^(.*/)?(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uv run pyrefly check"
language = "system"
types = ["python"]
pass_filenames = false
