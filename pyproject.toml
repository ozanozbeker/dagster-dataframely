[project]
name = "dagster-dataframely"
version = "0.6.0"
description = "A Dataframely integration for Dagster."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
maintainers = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = [
  "dagster",
  "data",
  "data-quality",
  "dataframely",
  "polars",
  "validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "dagster>=1.13.20",
  "dataframely>=3.0.0",
  "polars>=1.44.1",
  # Nothing imports this yet. It is declared ahead of the quarantine path (#104), which is
  # a `UPath`, because the alternative is dropping it here and adding it back one commit
  # later. It already arrives with `dagster`, on a requirement gated by Python version.
  "universal-pathlib>=0.2.0",
]

[project.urls]
Changelog = "https://github.com/ozanozbeker/dagster-dataframely/releases"
Homepage = "https://github.com/ozanozbeker/dagster-dataframely"
Issues = "https://github.com/ozanozbeker/dagster-dataframely/issues"
Repository = "https://github.com/ozanozbeker/dagster-dataframely"

[dependency-groups]
dev = [
  "dagster>=1.13.20",
  # One manager from each base class Dagster ships: `dagster-polars` is a
  # `UPathIOManager` and `dagster-duckdb-polars` is a `DbIOManager`. Between them the
  # delegation tests cover nearly every first-party manager (ADR-0006). `duckdb` is
  # transitive, and declared because the tests query the database directly.
  "dagster-duckdb-polars>=0.27.12",
  "dagster-graphql>=1.13.20",
  "dagster-polars>=0.27.12",
  "dagster-webserver>=1.13.20",
  "duckdb>=1.1",
  "prek>=0.5.1",
  "pyrefly>=1.2.0",
  "pytest>=9.1.1",
  "ruff>=0.16.5",
  "rumdl>=0.2.62",
]

[build-system]
requires = ["uv_build>=0.12.00,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib"
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.12,<0.13"
