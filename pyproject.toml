[project]
name = "dagster-dataframely"
version = "0.1.0"
description = "A Dataframely plugin for Dagster."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
maintainers = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = [
  "dagster",
  "data",
  "data-quality",
  "dataframely",
  "polars",
  "validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "dagster>=1.13.16",
  "dataframely>=3.0.0",
  "polars>=1.43.2",
  # Imported directly by the IO manager. Both already arrive with `dagster`, but a direct
  # import of a transitive dependency breaks silently if the intermediary ever drops it.
  # Dagster's `universal-pathlib` requirement is already gated on the Python version.
  "pydantic>=2",
  "universal-pathlib>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/ozanozbeker/dagster-dataframely"
Repository = "https://github.com/ozanozbeker/dagster-dataframely"
Issues = "https://github.com/ozanozbeker/dagster-dataframely/issues"
Changelog = "https://github.com/ozanozbeker/dagster-dataframely/releases"

[dependency-groups]
dev = [
  "dagster-graphql>=1.13.16",
  "dagster-webserver>=1.13.16",
  "prek>=0.4.12",
  "pyrefly>=1.2.0",
  "pytest>=9.1.1",
  "ruff>=0.16.1",
  "rumdl>=0.2.50",
]

[build-system]
requires = ["uv_build>=0.12.00,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# uv is the one tool that cannot come from `uv.lock`, because it is what reads the lock.
# `astral-sh/setup-uv` parses this key, so CI installs a matching uv instead of taking a
# version pinned separately in the workflow, and locally uv enforces it by refusing to
# run. The upper bound guards against a future lockfile format bump, not a past one:
# uv 0.11.30 still reads today's `revision = 3`.
required-version = ">=0.12,<0.13"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
