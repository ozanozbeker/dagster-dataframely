[project]
name = "dagster-dataframely"
version = "0.9.0"
description = "A Dataframely integration for Dagster."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
maintainers = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = [
  "dagster",
  "data",
  "data-quality",
  "dataframely",
  "polars",
  "validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Each lower bound is the version `uv.lock` resolves, because no test runs an older one.
# `universal-pathlib` and `duckdb` keep older bounds, because another dependency already
# requires each. This repo lists them only because it imports them directly.
dependencies = [
  "dagster>=1.13.24",
  "dataframely>=3.1.2",
  "polars>=1.44.2",
  "universal-pathlib>=0.2.0",
]

[project.urls]
Changelog = "https://ozanozbeker.com/dagster-dataframely/changelog.html"
Homepage = "https://github.com/ozanozbeker/dagster-dataframely"
Issues = "https://github.com/ozanozbeker/dagster-dataframely/issues"
Repository = "https://github.com/ozanozbeker/dagster-dataframely"

[dependency-groups]
dev = [
  # One subclass each of `UPathIOManager` and `DbIOManager`, so the delegation tests cover nearly every first-party IO manager (ADR-0006).
  "dagster-duckdb-polars>=0.29.24",
  "dagster-polars>=0.27.12",
  "duckdb>=1.1",
  "prek>=0.5.3",
  "pyrefly>=1.3.1",
  "pytest>=9.1.1",
  "ruff>=0.16.8",
  "rumdl>=0.2.75",
]
# Not in `dev`, so the test and lint jobs and a contributor running pytest skip the docs
# packages. This group omits `ipykernel`, because `great-docs` requires it through `jupyter`.
docs = ["great-docs>=0.17"]

[build-system]
requires = ["uv_build>=0.12.00,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.12,<0.13"

# In the workspace, so both projects use one `uv.lock` and the demo runs this working tree,
# not a published wheel. A root `uv sync` skips the demo, so CI tests without its webserver.
[tool.uv.workspace]
members = ["demo"]
