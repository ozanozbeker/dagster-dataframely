[project]
name = "dagster-dataframely"
version = "0.8.0"
description = "A Dataframely integration for Dagster."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
maintainers = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = [
  "dagster",
  "data",
  "data-quality",
  "dataframely",
  "polars",
  "validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Every lower bound in this file is the version `uv.lock` resolves, because nothing tests
# an older version. `universal-pathlib` and `duckdb` are the exceptions and keep older
# lower bounds: another dependency already installs each one, and this repo declares
# them only because it imports them directly.
dependencies = [
  "dagster>=1.13.24",
  "dataframely>=3.1.2",
  "polars>=1.44.2",
  "universal-pathlib>=0.2.0",
]

[project.urls]
Changelog = "https://ozanozbeker.com/dagster-dataframely/changelog.html"
Homepage = "https://github.com/ozanozbeker/dagster-dataframely"
Issues = "https://github.com/ozanozbeker/dagster-dataframely/issues"
Repository = "https://github.com/ozanozbeker/dagster-dataframely"

[dependency-groups]
dev = [
  # One manager from each base class Dagster ships: `dagster-polars` is a `UPathIOManager` and `dagster-duckdb-polars` is a `DbIOManager`. Between them the delegation tests cover nearly every first-party manager (ADR-0006). `duckdb` is transitive, and declared because the tests query the database directly.
  "dagster-duckdb-polars>=0.29.24",
  "dagster-polars>=0.27.12",
  "duckdb>=1.1",
  "prek>=0.5.3",
  "pyrefly>=1.3.1",
  "pytest>=9.1.1",
  "ruff>=0.16.8",
  "rumdl>=0.2.75",
]
# Its own group, not `dev`. `uv sync --locked` for the test and lint jobs then skips
# griffe, Pillow, nbclient and ipykernel, and a contributor running pytest installs none
# of them. `great-docs` brings its own kernel, so nothing here names `ipykernel`.
docs = ["great-docs>=0.17"]

[build-system]
requires = ["uv_build>=0.12.00,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.12,<0.13"

# `demo/` is a member rather than its own project, so one lockfile covers both and the demo
# always runs the working tree rather than a published wheel. A screenshot then shows the
# code in front of you. `uv sync` at the root installs this package alone, so the webserver
# the demo depends on stays out of the environment CI tests in.
[tool.uv.workspace]
members = ["demo"]
