# Great Docs configuration. `great-docs init` writes every option out at its default with
# the docs above it; this file keeps only what this project actually sets.
#
# `_quarto.yml` is generated into the ephemeral `great-docs/` build directory on every
# build, so it is never edited and never committed. This file is the only source of truth.

parser: numpy
dynamic: true

site_url: https://ozanozbeker.github.io/dagster-dataframely/

authors:
  - name: Ozan Ozbeker
    role: Maintainer
    email: github@ozanozbeker.com

# The README's fences stay plain ` ```python ` so GitHub and PyPI keep syntax highlighting,
# which neither gives a `{python}` info string. This script braces them in the build
# directory's generated `index.qmd`, so the landing page executes what the repository
# shows static. ADR-0009.
pre_render: scripts/brace-readme-fences.py

# Execute every page on every build, rather than Quarto's `auto`, which re-renders only
# when a page's own source changed. The examples are checked against the package, not
# against themselves: a rename in `src/` breaks a cell on a page whose `.qmd` nobody
# touched, and `auto` would serve the cached output and let it through. The gate is only a
# gate when it runs.
freeze: false

# Two tracks. The guide is the path a reader walks once, in the order the sections were
# already written to be met in; the reference is what they come back to look up. Splitting
# them keeps Settings, Naming, Errors and Hand-wiring out of a newcomer's reading path.
user_guide:
  - section: Guide
    contents:
      - declaring-an-asset.qmd
      - the-failure-policy.qmd
      - where-invalid-rows-go.qmd
      - what-a-run-produces.qmd
      - testing-an-asset.qmd
      - partitioning.qmd
      - lazyframes.qmd
  - section: Reference
    contents:
      - settings.qmd
      - naming.qmd
      - errors.qmd
      - hand-wiring.qmd

# By module, not by Python kind. The generated default groups the public surface into
# Classes, Exceptions, Functions, Constants and Type Aliases, which splits `dd.wiring`
# across four headings and buries the two names most readers want. This ordering is the one
# `wiring.py`'s own docstring states: the decorator is the happy path, hand-wiring is
# supported but not recommended, and the errors are looked up rather than read.
# By module, not by Python kind. The generated default groups the public surface into
# Classes, Exceptions, Functions, Constants and Type Aliases, which splits `dd.wiring`
# across four headings and buries the two names most readers want. This ordering is the one
# `wiring.py`'s own docstring states: the decorator is the happy path, hand-wiring is
# supported but not recommended, and the errors are looked up rather than read.
#
# The mapping form rather than the bare list, for `title` alone: it renames the navbar item
# from "Reference" to "API". Without it the navbar says Reference for these generated pages
# while the guide's own sidebar says Reference for its look-up track, and a reader has to
# click one to find out which is which.
reference:
  title: API
  desc: >-
    Every public name, generated from the source. The guide explains the behaviour; this is
    where the signatures are.
  sections:
    - title: Core
      desc: The decorator, and the spec that puts a quarantine in the graph.
      contents:
        - asset
        - quarantine_spec
        - Granularity
        - SchemaRules

    - title: Hand-wiring
      desc: >-
        The parts the decorator assembles, for a `@dg.asset` you wire yourself. Reach for
        these only where the decorator does not fit.
      contents:
        - wiring.schema_metadata
        - wiring.table_schema
        - wiring.check_specs
        - wiring.check_results
        - wiring.check_name
        - wiring.validation_results
        - wiring.AssetYield
        - wiring.QuarantineWriter
        - wiring.delegating_writer
        - wiring.file_writer
        - wiring.quarantine_frame
        - wiring.quarantine_path
        - wiring.validate_quarantine_key

    - title: Errors
      desc: Every error this package raises, all subclassing `DagsterDataframelyError`.
      contents:
        - errors.DagsterDataframelyError
        - errors.CollectionNotSupportedError
        - errors.ReservedColumnError
        - errors.UnnameableColumnError
        - errors.CheckNameCollisionError
        - errors.InvalidSettingError
        - errors.MaterializeResultValueError
        - errors.MaterializeResultFieldError
        - errors.ColumnSchemaError
        - errors.ValidationAbortError
        - errors.NothingSurvivedError
        - errors.QuarantineKeyCollisionError
        - errors.QuarantineDirError
