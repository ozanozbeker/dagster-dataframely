# Each build generates `great-docs/_quarto.yml` from this file, so edit this file, not that one.

parser: numpy
dynamic: true

site_url: https://ozanozbeker.com/dagster-dataframely/

authors:
  - name: Ozan Ozbeker
    role: Maintainer
    email: github@ozanozbeker.com

logo:
  light: assets/dagster-dataframely-hex-dark.svg

# The favicon is an SVG, because great-docs copies an SVG unchanged. great-docs' own PNG icons blur the mark, and with `cairosvg` they also shrink it.
favicon: assets/dagster-dataframely-favicon-dark.svg
# great-docs reads no pre-made icon sizes, so this links the exported Apple touch icon. The URL is absolute, because Quarto does not rewrite paths in header HTML.
include_in_header: '<link rel="apple-touch-icon" href="https://ozanozbeker.com/dagster-dataframely/assets/dagster-dataframely-favicon-dark-180.png">'

# `assets/theme.css` sets Nord's colors on the variables great-docs reads, then overrides the great-docs and Quarto rules that its comments name.
accent_color:
  light: "#5E81AC" # nord10
  dark: "#88C0D0" # nord8

site:
  css: assets/theme.css
  highlight-style: nord
  # Quarto's defaults give the body 800px, each sidebar 250px and each gutter 1.5em.
  grid:
    sidebar-width: 220px
    body-width: 1000px
    margin-width: 220px
    gutter-width: 1em

# The README's heading is the name, so the hero shows the hex, the tagline and the badges.
hero:
  name: false
  logo_height: 320px

# The image is a URL into `assets/`, because great-docs copies a local path to the build root, which Quarto does not publish.
social_cards:
  image: https://ozanozbeker.com/dagster-dataframely/assets/dagster-dataframely-social-card-dark.png

# Without `base_url`, great-docs sets the canonical URL and `og:url` to the github.io address, which redirects to `site_url`.
seo:
  canonical:
    base_url: https://ozanozbeker.com/dagster-dataframely/
  # great-docs 0.17.0 adds the site name a second time (posit-dev/great-docs#327). Delete this once a release includes #335.
  title_template: "{page_title}"

# Adds braces to the Python fences in the build directory's copies, so `README.md` and docstrings keep plain fences for GitHub, PyPI and ruff (ADR-0009).
pre_render: scripts/brace-example-fences.py

# This file has no `freeze:` key, so Quarto runs every page on every build. The build check needs that, because a change in `src/` can break a page nobody edited. `freeze: false` would have no effect, because great-docs omits it. Keeping `_freeze/` out of git and the CI cache makes every page run again.

# This list sets the page order and the Guide and Details sections, as pkgdown's `articles:` does. great-docs would otherwise order the pages by numeric filename prefix. A reader reads the Guide pages once, in order, starting with Get started, and looks things up in the Details pages.
user_guide:
  - section: Guide
    contents:
      - dagster-dataframely.qmd
      - declaring-an-asset.qmd
      - validation.qmd
      - rule-severity.qmd
      - filtering-error-rows.qmd
      - what-a-run-produces.qmd
      - testing-an-asset.qmd
      - partitioning.qmd
      - lazyframes.qmd
      - collection-checks.qmd
      - rule-checks.qmd
  - section: Details
    contents:
      - settings.qmd
      - naming.qmd
      - errors.qmd
      - hand-wiring.qmd
      - upgrading.qmd

# The sections follow the modules, because the default groups by kind and puts `dd.wiring` under four headings.
reference:
  desc: >-
    Generated from the source, these pages document every public name and its parameters. The
    guide tells the story around them.
  sections:
    - title: Core
      desc: >-
        `dd.asset` builds an asset from a schema, and `build_error_rows_spec` adds that asset's
        error rows to the asset graph. `build_collection_checks` returns asset checks that report
        a Collection's collection filters on its member assets. `build_rule_checks` returns asset
        checks that report a schema's rules on an asset `dd.asset` did not build.
      contents:
        - asset
        - build_error_rows_spec
        - build_collection_checks
        - build_rule_checks
        - Granularity

    - title: Data
      desc: >-
        `OrdersSchema`, `storefront_orders` and `marketplace_orders` are the example data that
        most examples on this site use. The package ships them, so an example copied from an
        editor hover runs as written.
      contents:
        - data.OrdersSchema
        - data.storefront_orders
        - data.marketplace_orders

    - title: Testing
      desc: >-
        `DirectInvocationResult.from_invocation` separates what a direct invocation of an asset
        built with `dd.asset` yields into its materialization and its check results.
      contents:
        - testing.DirectInvocationResult

    - title: Hand-wiring
      desc: >-
        `dd.asset` calls most of these functions. Use them to build a `@dg.asset` that `dd.asset` cannot
        build.
      contents:
        - wiring.get_column_schema_metadata
        - wiring.get_table_schema
        - wiring.get_code_version
        - wiring.build_asset_check_specs
        - wiring.evaluate_checks
        - wiring.get_check_name_for_rule
        - wiring.stream_results
        - wiring.ErrorRowsWriter
        - wiring.build_io_manager_writer
        - wiring.build_file_writer
        - wiring.get_error_rows
        - wiring.get_error_rows_path
        - wiring.validate_error_rows_key

    - title: Errors
      desc: >-
        `DagsterDataframelyError` is the base class of every other error this package defines.
      contents:
        - errors.DagsterDataframelyError
        - errors.CollectionNotSupportedError
        - errors.InvalidMembersError
        - errors.FailurePropagationError
        - errors.ReservedColumnError
        - errors.InvalidColumnNameError
        - errors.CheckNameCollisionError
        - errors.InvalidSeverityError
        - errors.InvalidSettingError
        - errors.MaterializeResultValueError
        - errors.MaterializeResultFieldError
        - errors.ColumnSchemaError
        - errors.ValidationAbortError
        - errors.NoValidRowsError
        - errors.ErrorRowsKeyCollisionError
        - errors.ErrorRowsDirError

# great-docs writes `skill.md` from the reference sections. These entries add what the guide bolds.
skill:
  decision_table:
    - need: Validate the frame an asset returns, and fill its Columns tab
      use: "@dd.asset(OrdersSchema)"
    - need: Write the rows that fail an "error" rule to a table instead of failing the run
      use: "@dd.asset(OrdersSchema, filter=True)"
    - need: Put the error rows in the asset graph
      use: dd.build_error_rows_spec(OrdersSchema, orders)
    - need: Check a table that dd.asset did not build
      use: dd.build_rule_checks(OrdersSchema, asset="warehouse_orders")
    - need: Report a Collection's collection filters as checks
      use: dd.build_collection_checks(Shop, members={...})
    - need: Read what a direct invocation yielded in a test
      use: dd.testing.DirectInvocationResult.from_invocation(orders(frame))
    - need: Build a @dg.asset from the parts yourself
      use: dd.wiring
  gotchas:
    - "The decorated function must return a frame with the schema's dtypes. The package never casts, so a dtype that differs fails the run before `Schema.filter` runs."
    - "Write the values of Polars' `is_in` in a `check=` or a `@dy.rule()` as a list, not a set of strings. Python orders a set of strings differently in each process, so the code version changes each time the code location starts."
    - "Returning `dg.MaterializeResult(value=None)` raises `MaterializeResultValueError`. To skip, return `None` itself."
    - "A Polars upgrade can change every asset's code version at once, because the hash uses Polars' expression serialization."
    - "`filter=True` adds a `context` parameter to the asset, so a direct invocation passes `dg.build_asset_context()` first."
    - "A direct invocation with error rows needs `DAGSTER_DATAFRAMELY_ERROR_ROWS_DIR`, or it raises `ErrorRowsDirError`."
    - "`DAGSTER_DATAFRAMELY_STATISTICS` accepts only `true` or `false`, in any letter case. `1`, `yes` and `on` raise `InvalidSettingError`."
  best_practices:
    - "Import the module, not the name: `import dagster_dataframely as dd`, then `@dd.asset`. A bare `asset` reads as Dagster's."
    - "Name a `dy.Schema` subclass with the `Schema` suffix, as Dataframely does: `OrdersSchema` is the schema, `orders` is the asset."
    - "To try the package, use `dd.data.OrdersSchema`, `dd.data.storefront_orders` and `dd.data.marketplace_orders`, so your output matches the examples in the documentation."
    - "Pin to one minor version before 1.0, and read [Upgrading](https://ozanozbeker.com/dagster-dataframely/user-guide/upgrading.html) before moving to the next."
