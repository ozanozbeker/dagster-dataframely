name: Docs

# Its own workflow rather than a job on `ci.yml`. Publishing needs `pages: write` and
# `id-token: write`, and `ci.yml` is `contents: read` throughout; keeping the two apart
# means the workflow that runs the tests is not also the one that can publish.
#
# Generated by `great-docs setup-github-pages`, then hardened to what `prek.toml`'s zizmor
# and actionlint already demand of `ci.yml`: every action pinned to a commit, no persisted
# credentials, least-privilege tokens, and no `${{ }}` pasted into a shell.
#
# GitHub Pages must be enabled on the repository first (Settings, Pages, Source: GitHub
# Actions). `actions/deploy-pages` cannot turn it on, and fails with a 404 if it is off.

on:
  pull_request:
  push:
    branches: [main]
  # No `release:` trigger, though the changelog page is built from GitHub Releases and so
  # lags by one build after publishing one. zizmor reads a publishing trigger plus a
  # restored cache as a cache-poisoning path, and it is right: a pull request writes that
  # cache. Run this workflow by hand after publishing, or let the next push to main carry
  # the changelog.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on pull requests too, and that is the point. Every code cell on the site executes
  # at build time, so a raising cell fails this job, and an example that stopped being true
  # is caught in review rather than after merge.
  build:
    runs-on: ubuntu-latest
    # A guide cell that deadlocks has nothing to stop it: Quarto's Jupyter engine sets no
    # per-cell timeout, and a fork's pull request runs its cells as code.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Great Docs reads git history for page timestamps and source links.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Without a suffix this key is byte-identical to `ci.yml`'s, which caches the dev
          # group alone. The faster test job wins the save, and this job then reports a
          # cache hit and downloads the 89 docs-only packages anyway, every run.
          cache-suffix: docs
      # Pinned rather than left at the action's `release` default, which resolves the
      # latest Quarto at run time. A pinned action downloading a floating 150 MB binary is
      # not a pinned toolchain, and a Quarto release landing mid-review would change what
      # the same commit renders with nothing in `git log` to point at.
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.18"
      # `--group docs` on top of the default groups: `great-docs` needs the package itself
      # importable, because it introspects it rather than parsing it. `--all-packages` because
      # every guide page imports the demo's schema and data, and the demo is a workspace
      # member a root sync leaves out.
      - run: uv sync --locked --all-packages --group docs
      # The changelog page is fetched from the GitHub API. Unauthenticated, that is 60
      # requests an hour per shared runner IP, and great-docs answers a 403 by warning and
      # shipping a site with no changelog page rather than by failing.
      - run: uv run --no-sync great-docs build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: great-docs/_site
          include-hidden-files: true

  # A manual run from a branch builds and stops here. Only `main` publishes.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
