name: Docs

# Its own workflow rather than a job on `ci.yml`. Publishing needs `pages: write` and
# `id-token: write`, and `ci.yml` is `contents: read` throughout; keeping the two apart
# means the workflow that runs the tests is not also the one that can publish.
#
# Generated by `great-docs setup-github-pages`, then hardened to what `prek.toml`'s zizmor
# and actionlint already demand of `ci.yml`: every action pinned to a commit, no persisted
# credentials, least-privilege tokens, and no `${{ }}` pasted into a shell.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on pull requests too, and that is the point. Every code cell on the site executes
  # at build time, so a raising cell fails this job, and an example that stopped being true
  # is caught in review rather than after merge.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Great Docs reads git history for page timestamps and source links.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      # `--group docs` on top of the default groups: `great-docs` needs the package itself
      # importable, because it introspects it rather than parsing it.
      - run: uv sync --locked --group docs
      - run: uv run --no-sync great-docs build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: great-docs/_site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
