name: Docs

# Separate from `ci.yml`, so the workflow that runs the tests cannot publish: publishing needs
# `pages: write` and `id-token: write`.
#
# Generated by `great-docs setup-github-pages`, then changed to pass zizmor and actionlint:
# actions pinned to commits, no persisted credentials, least-privilege tokens, and no `${{ }}`
# in a `run:` command.
#
# Enable GitHub Pages first (Settings, Pages, Source: GitHub Actions). `actions/deploy-pages`
# cannot enable it, and fails with a 404 if it is off.

on:
  pull_request:
  push:
    branches: [main]
  # No `release:` trigger: zizmor reports a release trigger that restores a cache as cache
  # poisoning, because a pull request writes that cache. So the changelog page, built from
  # GitHub Releases, updates on the next push to `main` or on a manual run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Also runs on pull requests: every code cell runs at build time, so an example that no longer
  # works fails the pull request, not `main`.
  build:
    runs-on: ubuntu-latest
    # Quarto's Jupyter engine sets no per-cell timeout, and a fork's pull request runs its own
    # cells, so this stops a cell that hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Great Docs reads git history for page timestamps and source links.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Without a suffix this key matches `ci.yml`'s, whose cache has only the dev group. The
          # test job saves its cache first, so this job gets a cache hit and still downloads the
          # docs packages on every run.
          cache-suffix: docs
      # Pinned, because the action's `release` default installs the latest Quarto at run time,
      # so a Quarto release could change the build with no change in `git log`.
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.18"
      # `--group`, not `--only-group`, because great-docs imports the package to document it.
      # `--all-packages`, because every guide page imports the demo, which a root sync skips.
      - run: uv sync --locked --all-packages --group docs
      # great-docs fetches the changelog from the GitHub API. Without a token the limit is 60
      # requests an hour per shared runner IP, and on a 403 great-docs builds without the
      # changelog page instead of failing.
      - run: uv run --no-sync great-docs build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: great-docs/_site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
