name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `uv.lock` pins dagster, dataframely and polars at their floors, so this job runs the oldest
  # versions `pyproject.toml` allows.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  # Without this job only a local commit hook runs the `prek.toml` hooks, so nothing checks a
  # fork's pull request or a `--no-verify` commit. It is separate from `lowest` so that a lint
  # failure does not hide a test failure.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The commit-msg hook does not run here, because there is no commit message.
      - run: uv run --no-sync prek run --all-files --show-diff-on-failure

  # `dagster-polars` is in the `integration` group, not `dev`, so a release of it that breaks on
  # new Polars fails only this job and `integration-latest` in `upstream.yml`. Both run only
  # `tests/test_dagster_polars.py`.
  integration-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group integration
      - run: uv run --no-sync pytest tests/test_dagster_polars.py
