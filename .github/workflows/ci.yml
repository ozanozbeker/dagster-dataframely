name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  # Without this job only a local commit hook runs the `prek.toml` hooks, so nothing checks a
  # fork's pull request or a `--no-verify` commit. It is separate from `test` so that a lint
  # failure does not hide a test failure.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # `--all-files`, because a run on the changed files does not check the rest of the tree.
      # The commit-msg hook does not run here, because there is no commit message.
      - run: uv run --no-sync prek run --all-files --show-diff-on-failure

  # This job runs the tests against unpinned releases. `tests/test_upstream_characterization.py`
  # fails when an upstream release changes behaviour this package depends on.
  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: latest-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --upgrade
      # Fails on Dagster's deprecation warnings, which come before a removal. They are plain
      # `DeprecationWarning`s, so the filter matches their message. The filter uses `-o`, not
      # `-W`, because pytest escapes a `-W` message, so it cannot be a regex.
      - run: >
          uv run --no-sync pytest
          -o "filterwarnings=error:.*is deprecated and will be removed in:DeprecationWarning"
