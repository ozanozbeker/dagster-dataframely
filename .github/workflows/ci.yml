name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync pytest

  # Everything `prek.toml` holds: ruff, pyrefly, rumdl, gitleaks, zizmor, actionlint,
  # typos, `uv lock --check`, and the two source bans the package states in prose. A local
  # commit hook is the only other thing that runs them, so without this job a fork's pull
  # request, or one `--no-verify`, lands unchecked.
  #
  # Its own job rather than a step on `test`. Installing the hook environments is slow and
  # has nothing to do with the test matrix, and a red lint should not hide a red test.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # `--all-files`, because a hook run against a diff proves nothing about the rest of
      # the tree. The commit-msg hook has no commit to read here and skips itself.
      - run: uv run --no-sync prek run --all-files --show-diff-on-failure

  # The drift tripwire: `tests/test_upstream_characterization.py` against unpinned releases.
  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: latest-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --upgrade
      # Dagster deprecates before it removes and raises a plain `DeprecationWarning`, so its sentence is the only handle. `-o` not `-W`: pytest escapes `-W` messages.
      - run: >
          uv run --no-sync pytest
          -o "filterwarnings=error:.*is deprecated and will be removed in:DeprecationWarning"
