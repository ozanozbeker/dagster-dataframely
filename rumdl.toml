[global]
enable = ["ALL"]
disable = [
  "MD024",  # Multiple headings with the same content
  "MD063",  # Heading text capitalization style
  "MD082",  # No content before the next heading
]
exclude = [
  # Skill files, kept identical to their source repos
  ".claude",
  "docs/agents/",
]
respect-gitignore = true
# `quarto` enables MD078, which requires a label on every executable chunk. MD078 does not read
# the `%%|` label of a mermaid cell, so each diagram disables it on its own fence, and the rule
# still checks every Python chunk.
flavor = "quarto"
line-length = 120

[MD013]
line-length = 0
code-blocks = false
reflow = true
reflow-mode = "sentence-per-line"
severity = "info"

[MD093]
code = false
