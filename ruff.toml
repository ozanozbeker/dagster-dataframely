# A `.qmd` is markdown, and saying so is what lets the formatter reach the guide's code
# chunks: without it ruff parses the file as Python and dies on the YAML frontmatter. Ruff
# formats markdown but does not lint it, so an unused import or an ambiguous name inside a
# chunk still reaches nobody.
extension = { qmd = "markdown" }

# Ruff configuration file
# See: https://docs.astral.sh/ruff/

target-version = "py312"

[lint]
select = ["ALL"]
ignore = [
  # No per-file copyright headers; a single top-level LICENSE covers the project
  "CPY001",  # flake8-copyright

  # Recommended rules to disable per the docs
  "COM812",  # flake8-commas
  "COM819",  # flake8-commas
  "D206",  # pydocstyle
  "D207",  # pydocstyle
  "D208",  # pydocstyle
  "D300",  # pydocstyle
  "E111",  # pycodestyle Error
  "E114",  # pycodestyle Error
  "E117",  # pycodestyle Error
  "E501",  # pycodestyle Error
  "Q",  # flake8-quotes
  "W191",  # pycodestyle Warning
]
unfixable = [
  "F401",  # Pyflakes > unused-import
  "T20",  # flake8-print > ALL
]

[lint.pep8-naming]
classmethod-decorators = ["dataframely.rule"]

[lint.per-file-ignores]
# __init__.py related ignores
"**/__init__.py" = [
  "D104",  # pydocstyle > undocumented-public-package
  "F401",  # Pyflakes > unused-import
]

# Pytest related ignores
"**/tests/**/*.py" = [
  "ANN",  # flake8-annotations > ALL
  "ARG001",  # flake8-unused-arguments > unused-function-argument
  "D",  # pydocstyle > ALL
  "FBT001",  # flake8-boolean-trap > boolean-type-hint-positional-argument
  "INP001",  # flake8-implicit-namespace-package > implicit-namespace-package
  "PLR0913",  # Pylint Refactor > too-many-arguments
  "PLR2004",  # Pylint Refactor > magic-value-comparison
  "S101",  # flake8-bandit > assert
  "SLF001",  # flake8-self > private-member-access
]

[lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "dagster.Config",
  "dagster.ConfigurableResource",
  "dagster.ConfigurableIOManager",
  "pydantic.BaseModel",
]
runtime-evaluated-decorators = [
  "dagster.asset",
  "dagster.multi_asset",
  "dagster.graph_asset",
  "dagster.op",
  "dagster.asset_check",
]

[lint.pydocstyle]
convention = "numpy"

[format]
# Markdown formatting is still preview at 0.16.7, and it is the whole reason `extension`
# above is set. The cost is preview's other formatter changes, which restyled 153 lines
# across six files when this landed; none of them changed behaviour.
preview = true
docstring-code-format = true
line-ending = "lf"
