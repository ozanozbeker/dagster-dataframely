[project]
name = "dagster-dataframely-demo"
version = "0.1.0"
description = "Every UI surface dagster-dataframely touches, in one Dagster code location."
requires-python = ">=3.12"
# The webserver and the CLI are ordinary dependencies, not a `dev` group, because the demo is
# never published. A group would only add a `--group` flag to every command that runs it.
dependencies = [
  "dagster",
  "dagster-dataframely",
  "dagster-dg-cli",
  "dagster-polars",
  "dagster-webserver",
  "dataframely",
  "polars",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.12.00,<0.13.0"]
build-backend = "uv_build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_dataframely_demo"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]

[tool.uv.sources]
dagster-dataframely = { workspace = true }
